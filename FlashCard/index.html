<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <h1>Falshcrads</h1>
      <div id="deckControls">
        <input type="text" id="newDeckName" placeholder="New deck name" />
        <button id="createDeckBtn">Create Deck</button>

        <select id="deckSelect"></select>
      </div>
      <div id="field">
        <div id="addCard">
          <input type="text" id="front" autocomplete="off" />
          <input type="text" id="back" autocomplete="off" />
          <input type="button" value="add" id="addCardButton" />
        </div>
        <div id="showCards">
          <table>
            <thead>
              <tr>
                <td>Front</td>
                <td>Back</td>
                <td>Learned</td>
                <td>Delete</td>
                <td>Edit</td>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="studyMode">
      <h2>Study Mode</h2>

      <div class="studySettings">
        <button id="startBtn">Start</button>

        <label class="checkboxLabel">
          <input type="checkbox" id="onlyUnlearned" />
          Only unlearned
        </label>

        <button id="shuffle">Shuffle</button>
      </div>

      <div id="cardDisplay">Start study mode</div>

      <div id="modeControl">
        <button id="prev">Previous</button>
        <button id="flip">Flip</button>
        <button id="next">Next</button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
