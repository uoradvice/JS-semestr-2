<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game 12</title>

  <link
          href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap"
          rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<h1>Game 12</h1>

<div class="setup">
  <label for="playerCount">Players:</label>
  <select id="playerCount">
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8">8</option>
  </select>

  <input type="button" value="Start" id="start" />
  <input type="button" value="Draw" id="go" disabled />
</div>

<hr />
<div id="Dice">Choose players and press Start</div>
<div id="message"></div>
<hr />
<div id="GameField"></div>

<script src="main.js"></script>
</body>
</html>
