<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Simon Says</h1>

      <section class="panel">
        <button id="startBtn" type="button">Start</button>

        <div id="status" class="status">Нажми Start</div>

        <div class="scores">
          <span>Level: <b id="level">0</b></span>
          <span>Best: <b id="best">0</b></span>
        </div>
      </section>

      <section id="board" class="board">
        <button class="card" data-idx="0" type="button"></button>
        <button class="card" data-idx="1" type="button"></button>
        <button class="card" data-idx="2" type="button"></button>
        <button class="card" data-idx="3" type="button"></button>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
